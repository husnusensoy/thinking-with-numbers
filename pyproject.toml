[project]
name = "thinking-in-numbers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bq>=0.8.0",
    "duckdb>=1.5.2",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pre-commit>=4.6.0",
    "pydeck>=0.9.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "stqdm>=0.0.5",
    "streamlit>=1.56.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.11",
]

[tool.ruff]
# Target Python 3.11
target-version = "py311"
line-length = 100

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Enable additional rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "RUF",    # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",    # line too long (handled by formatter)
    "TRY003",  # avoid specifying long messages outside exception class
    "DTZ005",  # datetime.now() without timezone
    "B008",    # function call in argument defaults
    "PLR2004", # assert statement detected (allowed in tests)

]

[tool.ruff.lint.per-file-ignores]
# Tests can use assert statements
"tests/**/*.py" = ["S101", "PLR2004", "ARG001"]
# __init__ files can have unused imports
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["henkan"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
